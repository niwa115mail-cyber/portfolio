          <h2 class="article-title">株式会社ClearPalace<br>コーポレートサイト</h2>
          <div class="article-body">
            <p>
              <img src="img/topscreen.jpg" width="1000" height="913" alt="作品スクリーンショット">
            </p>
            <p>
              「思考を再起動する」をコンセプトにした、働く大人のためのプレミアム強炭酸フレーバーティーブランドのコーポレートサイトです。<br>（作品について一言）
            </p>
            <h3>URL</h3>
            <p><a href="https://niwa115mail-cyber.github.io/CLEAR_PULSE/" target="_blank" rel="noopener"></a></p><a href="https://niwa115mail-cyber.github.io/site02/></a></p>
            <h3>担当</h3>
            <p>デザイン・コーディング</p>
            <h3>サイトの目的</h3>
            <p>課題制作・就職活動のため</p>
            <h3>ターゲット</h3>
            <p>20代～50代のオフィスで働く会社員男女</p>
            <h3>デザインについて</h3>
            <p>
              コンセプトである「クリアな余白」を体現するため、白ベースのすっきりとしたレイアウトを採用。<br>フォントや線の太さを繊細にコントロールし、洗練された上質感を演出しました。
                              </p>
            <h3>コーディングについて</h3>
            <p>
              ABOUTセクションでは、グリッドレイアウト（display: grid）を活用して左右のテキストと4枚のタイル画像の高さを完璧に同期させ、視線誘導がスムーズに行われる美しい均等配置にこだわりました。<br>また、ニュースセクションには動きのあるスライダーを導入し、ブランドの「鼓動（パルス）」という躍動感を表現しています。
            </p>
